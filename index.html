<!DOCTYPE html>  <html lang="hi">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>ConnectChat</title>  
<style>  
*{box-sizing:border-box;margin:0;padding:0}  
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#222}  
header{background:#075e54;color:white;padding:15px;display:flex;align-items:center;justify-content:space-between}  
header h1{font-size:21px}  
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:15px}  
#logoutBtn{background:white;color:#075e54;font-weight:bold}  
#profileBtn{background:white;color:#075e54;font-weight:bold}  
.container{max-width:650px;margin:auto;padding:15px}  
.card{background:white;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0001}  
h2,h3{color:#075e54;margin-bottom:10px}  
#searchInput{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px;margin:12px 0}  
.user,.chatItem{padding:14px;border-bottom:1px solid #eee;cursor:pointer}  
.user:hover,.chatItem:hover{background:#f3f8f7}  
.userName{font-weight:bold;color:#075e54;font-size:17px}  
.status{text-align:center;padding:15px;color:#777}  
#chatView,#profileView{display:none}  
.chatHeader{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding-bottom:12px}  
#backBtn,#profileBackBtn{background:#e8f5f2;color:#075e54}  
#chatUsername{font-weight:bold;color:#075e54;font-size:18px}  
#messages{height:55vh;min-height:300px;overflow-y:auto;padding:12px;background:#e9f5f2;border-radius:10px;margin:12px 0;display:flex;flex-direction:column;gap:8px}  
.msg{max-width:80%;padding:10px 12px;border-radius:12px;overflow-wrap:anywhere}  
.mine{align-self:flex-end;background:#d5f5dc}  
.theirs{align-self:flex-start;background:white}  
#sendForm{display:flex;gap:8px}  
#messageInput{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px}  
#sendBtn{background:#075e54;color:white;font-weight:bold}  
#sendBtn:disabled{opacity:.5}  
#chatError,#profileMessage{color:#c00;font-size:13px;margin-top:8px}  
.chatItem{display:flex;align-items:center;justify-content:space-between;gap:10px}  
.chatDetails{min-width:0;flex:1}

.chatTime{font-size:12px;color:#888;white-space:nowrap}  
.profileTop{text-align:center;padding:10px}  
#profilePhoto{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#e8f5f2;margin:10px auto;display:block}  
#profileDisplayName{font-size:21px;font-weight:bold;color:#075e54;margin:8px}  
#profileAboutDisplay{color:#666;margin:8px}  
.profileInput{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px;margin:8px 0}  
.profileLabel{display:block;margin-top:12px;font-weight:bold;color:#075e54}  
#saveProfileBtn{background:#075e54;color:white;font-weight:bold;width:100%;margin-top:12px}  
footer{text-align:center;color:#888;padding:18px;font-size:13px}  
</style>  
</head>  
<body>  <header>  
  <h1>ConnectChat 💬</h1>  
  <div style="display:flex;gap:8px">  
    <button id="profileBtn">👤 Profile</button>  
    <button id="logoutBtn">Logout</button>  
  </div>  
</header>  <main class="container">  <!-- HOME -->  <div id="listView">  
  <div class="card">  
    <h2>Welcome to ConnectChat!</h2>  
    <div id="profileName">Loading...</div>  
  </div>    <div class="card">  
    <h3>💬 Recent Chats</h3>  
    <div id="recentChats" class="status">Chats load ho rahi hain...</div>  
  </div>    <div class="card">  
    <h3>👥 Find People</h3>  
    <input id="searchInput" type="search" placeholder="Username search karo...">  
    <div id="usersList" class="status">Users load ho rahe hain...</div>  
  </div>  
</div>  <!-- CHAT -->  <div id="chatView" class="card">  
  <div class="chatHeader">  
    <button id="backBtn">← Back</button>  
    <div id="chatUsername">Username</div>  
  </div>  
  <div id="messages">  
    <div class="status">Messages load ho rahe hain...</div>  
  </div>  
  <form id="sendForm">  
    <input id="messageInput" type="text" placeholder="Message likho..." autocomplete="off" maxlength="2000" required>  
    <button id="sendBtn" type="submit">Send</button>  
  </form>  
  <div id="chatError"></div>  
</div>  <!-- PROFILE -->  <div id="profileView" class="card">  
  <div class="chatHeader">  
    <button id="profileBackBtn">← Back</button>  
    <h3>My Profile</h3>  
  </div>    <div class="profileTop">  
    <img id="profilePhoto" src="" alt="Profile photo">  
    <div id="profileDisplayName">Username</div>  
    <div id="profileAboutDisplay">About</div>  
  </div>    <form id="profileForm">  
    <label class="profileLabel" for="editUsername">Username</label>  
    <input id="editUsername" class="profileInput" maxlength="20" required>  <label class="profileLabel" for="editAbout">About</label>  
<input id="editAbout" class="profileInput" maxlength="100" placeholder="Apne baare mein likho">  

<label class="profileLabel" for="editPhotoURL">Profile photo URL (optional)</label>  
<input id="editPhotoURL" class="profileInput" type="url" placeholder="https://...">  

<button id="saveProfileBtn" type="submit">Save Profile</button>

  </form>  
  <div id="profileMessage"></div>  
</div>  </main>  
<footer>ConnectChat — Connect with everyone</footer> 
  <script type="module">  
import {auth,db} from "./firebase.js";  
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";  
import {  
  collection,getDocs,doc,getDoc,setDoc,addDoc,updateDoc,  
  serverTimestamp,query,orderBy,onSnapshot,where  
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";  
    import {
  getDatabase,
  ref,
  onValue,
  onDisconnect,
  set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  
const profileName=document.getElementById("profileName");  
const usersList=document.getElementById("usersList");  
const recentChats=document.getElementById("recentChats");  

    // ONLINE / OFFLINE STATUS

const realtimeDB = getDatabase();
let statusListener = null;

function setOnlineStatus(uid) {
  const statusRef = ref(realtimeDB, "status/" + uid);
  const connectedRef = ref(realtimeDB, ".info/connected");

  onValue(connectedRef, async (snapshot) => {
    if (snapshot.val() === true) {
      try {
        await onDisconnect(statusRef).set({
          state: "offline",
          lastChanged: Date.now()
        });

        await set(statusRef, {
          state: "online",
          lastChanged: Date.now()
        });

        console.log("Online status set successfully");
      } catch (error) {
        console.error("Status error:", error);
      }
    }
  });
    }
    
const searchInput=document.getElementById("searchInput");  
const logoutBtn=document.getElementById("logoutBtn");  
const profileBtn=document.getElementById("profileBtn");  
const listView=document.getElementById("listView");  
const chatView=document.getElementById("chatView");  
const profileView=document.getElementById("profileView");  
const backBtn=document.getElementById("backBtn");  
const profileBackBtn=document.getElementById("profileBackBtn");  
const chatUsername=document.getElementById("chatUsername");  
const messagesDiv=document.getElementById("messages");  
const sendForm=document.getElementById("sendForm");  
const messageInput=document.getElementById("messageInput");  
const sendBtn=document.getElementById("sendBtn");  
const chatError=document.getElementById("chatError");
const attachBtn=document.getElementById("attachBtn");
const fileInput=document.getElementById("fileInput");
const filePreview=document.getElementById("filePreview");

const profilePhoto=document.getElementById("profilePhoto");  
const profileDisplayName=document.getElementById("profileDisplayName");  
const profileAboutDisplay=document.getElementById("profileAboutDisplay");  
const profileForm=document.getElementById("profileForm");  
const editUsername=document.getElementById("editUsername");  
const editAbout=document.getElementById("editAbout");  
const editPhotoURL=document.getElementById("editPhotoURL");  
const saveProfileBtn=document.getElementById("saveProfileBtn");  
const profileMessage=document.getElementById("profileMessage");  
  
let currentUser=null;  
let currentProfile={};  
let allUsers=[];  
let activeChatId=null;  
let unsubscribeMessages=null;

// WebRTC direct file transfer (5 MB limit; both users should keep chat open)
let peerConnection=null;
let dataChannel=null;
let currentSignalId=null;
let activePeerUid=null;
let isCaller=false;
let unsubscribeSignal=null;
let unsubscribeIncomingSignals=null;
let unsubscribeRemoteCandidates=null;
let remoteDescriptionReady=false;
let pendingRemoteCandidates=[];
let receivedFileMeta=null;
let receivedFileChunks=[];
let receivedFileBytes=0;
const MAX_FILE_SIZE=5*1024*1024;
const FILE_CHUNK_SIZE=16*1024;
const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};

onAuthStateChanged(auth,async user=>{  
  if(!user){  
    location.href="login.html";  
    return;  
  }  

setOnlineStatus(user.uid);
  currentUser=user;  
  try{  
    const profileSnap=await getDoc(doc(db,"users",user.uid));  
    currentProfile=profileSnap.exists()?profileSnap.data():{};  
    updateProfileDisplay();  
    await loadUsers();  
    await loadRecentChats();  
  }catch(error){  
    console.error(error);  
    profileName.textContent=currentProfile.username||"User";  
    usersList.textContent="Users load nahi hue: "+error.message;  
    recentChats.textContent="Chats load nahi hui: "+error.message;  
  }  
});  
  
function updateProfileDisplay(){  
  const username=currentProfile.username||"User";  
  profileName.textContent=username;  
  profileDisplayName.textContent=username;  
  profileAboutDisplay.textContent=currentProfile.about||"Hey! I am using ConnectChat.";  
  editUsername.value=username;  
  editAbout.value=currentProfile.about||"";  
  editPhotoURL.value=currentProfile.photoURL||"";  
  profilePhoto.src=currentProfile.photoURL||"";  
  profilePhoto.style.display=currentProfile.photoURL?"block":"none";  
}  
  
profileBtn.onclick=()=>{  
  listView.style.display="none";  
  chatView.style.display="none";  
  profileView.style.display="block";  
  profileMessage.textContent="";  
};  
  
profileBackBtn.onclick=()=>{  
  profileView.style.display="none";  
  listView.style.display="block";  
};  
  
profileForm.onsubmit=async event=>{  
  event.preventDefault();  
  const username=editUsername.value.trim();  
  const about=editAbout.value.trim();  
  const photoURL=editPhotoURL.value.trim();  
  
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){  
    profileMessage.textContent="Username 3-20 characters ka ho, letters/numbers/underscore.";  
    return;  
  }  
  saveProfileBtn.disabled=true;  
  profileMessage.style.color="#075e54";  
  profileMessage.textContent="Profile save ho rahi hai...";  
  
  try{  
    await updateDoc(doc(db,"users",currentUser.uid),{  
      username,  
      usernameLower:username.toLowerCase(),  
      about,  
      photoURL  
    });  
    currentProfile={...currentProfile,username,usernameLower:username.toLowerCase(),about,photoURL};  
    updateProfileDisplay();  
    await loadUsers();  
    profileMessage.textContent="Profile save ho gayi!";  
  }catch(error){  
    console.error(error);  
    profileMessage.style.color="red";  
    profileMessage.textContent="Save nahi hua: "+error.message;  
  }finally{  
    saveProfileBtn.disabled=false;  
  }  
};  
  
async function loadUsers(){  
  usersList.textContent="Users load ho rahe hain...";  
  try{  
    const snapshot=await getDocs(collection(db,"users"));  
    allUsers=snapshot.docs
  .map(d=>({
    ...d.data(),
    uid: d.id
  }))
  .filter(person=>person.uid!==currentUser.uid);
    renderUsers(searchInput.value);  
  }catch(error){  
    console.error(error);  
    usersList.textContent="Users load nahi hue: "+error.message;  
  }  
}  
  
const userStatusUnsubscribers = new Map();
const userStatuses = {};

function renderUsers(search="") {
  const term = search.trim().toLowerCase();

  // Har user ka status listener ek hi baar lagao
  allUsers.forEach(person => {
    const uid = person.uid || person.id;

    if (!uid || userStatusUnsubscribers.has(uid)) return;

    const statusRef = ref(realtimeDB, "status/" + uid);

    const unsubscribe = onValue(statusRef, snapshot => {
      const data = snapshot.val();
      userStatuses[uid] = data?.state || "offline";
      renderUsers(search);
    });

    userStatusUnsubscribers.set(uid, unsubscribe);
  });

  const filtered = allUsers.filter(person =>
    (person.username || "").toLowerCase().includes(term)
  );

  usersList.innerHTML = "";

  if (!filtered.length) {
    usersList.textContent = "Koi user nahi mila.";
    return;
  }

  filtered.forEach(person => {
    const uid = person.uid || person.id;
    const row = document.createElement("div");
    row.className = "user";

    const name = document.createElement("div");
    name.className = "userName";
    name.textContent = person.username || "User";

    const status = document.createElement("small");
    const isOnline = userStatuses[uid] === "online";

    status.textContent = isOnline ? "● Online" : "● Offline";
    status.style.color = isOnline ? "#16a34a" : "#888";
    status.style.display = "block";
    status.style.marginTop = "4px";

    row.appendChild(name);
    row.appendChild(status);

    row.onclick = () => openChat(person);
    usersList.appendChild(row);
  });
    }
    
searchInput.addEventListener("input",()=>renderUsers(searchInput.value));  
  
async function loadRecentChats(){  
  recentChats.textContent="Chats load ho rahi hain...";  
  try{  
    const chatsQuery=query(  
      collection(db,"chats"),  
      where("members","array-contains",currentUser.uid)  
    );  
    const snapshot=await getDocs(chatsQuery);  
    const chatData=snapshot.docs.map(d=>({id:d.id,...d.data()}));  
    chatData.sort((a,b)=>{  
      const ta=a.updatedAt?.toMillis?.()||0;  
      const tb=b.updatedAt?.toMillis?.()||0;  
      return tb-ta;  
    });  
  
    recentChats.innerHTML="";  
    if(chatData.length===0){  
      recentChats.textContent="Abhi koi chat nahi. Find People se chat shuru karo.";  
      return;  
    }  
  
    for(const chat of chatData){  
      const otherUid=(chat.members||[]).find(uid=>uid!==currentUser.uid);  
      if(!otherUid)continue;  
      let otherProfile={};  
      try{  
        const userSnap=await getDoc(doc(db,"users",otherUid));  
        if(userSnap.exists())otherProfile=userSnap.data();  
      }catch(e){console.warn(e);}  
  
      const row=document.createElement("div");  
      row.className="chatItem";  
      const details=document.createElement("div");  
      details.className="chatDetails";  
      const name=document.createElement("div");  
      name.className="userName";  
      name.textContent=otherProfile.username||"User";  
      const preview=document.createElement("div");  
      preview.className="chatPreview";  
      preview.textContent=chat.lastMessage||"Chat shuru karo";  
      details.append(name,preview);  
      const time=document.createElement("div");  
      time.className="chatTime";  
      time.textContent=formatTime(chat.updatedAt);  
      row.append(details,time);  
      row.onclick=()=>openChat(otherProfile.uid?otherProfile:{uid:otherUid,username:"User"});  
      recentChats.appendChild(row);  
    }  
    if(!recentChats.children.length)recentChats.textContent="Abhi koi chat nahi.";  
  }catch(error){  
    console.error(error);  
    recentChats.textContent="Chats load nahi hui: "+error.message;  
  }  
}  
  
function formatTime(timestamp){  
  if(!timestamp?.toDate)return "";  
  const date=timestamp.toDate();  
  if(date.toDateString()===new Date().toDateString()){  
    return date.toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit"});  
  }  
  return date.toLocaleDateString("hi-IN",{day:"numeric",month:"short"});  
}  
  
// ---------- WEBRTC SIGNALING + FILE TRANSFER ----------
async function saveIceCandidate(candidate, collectionName) {
  if (!activeChatId || !currentSignalId) return;
  try {
    await addDoc(collection(db,"chats",activeChatId,"signals",currentSignalId,collectionName),candidate.toJSON());
  } catch (error) { console.error("ICE save error:",error); }
}

function stopWebRTC(){
  if(unsubscribeSignal){unsubscribeSignal();unsubscribeSignal=null;}
  if(unsubscribeIncomingSignals){unsubscribeIncomingSignals();unsubscribeIncomingSignals=null;}
  if(unsubscribeRemoteCandidates){unsubscribeRemoteCandidates();unsubscribeRemoteCandidates=null;}
  if(dataChannel){try{dataChannel.close();}catch(e){} dataChannel=null;}
  if(peerConnection){try{peerConnection.close();}catch(e){} peerConnection=null;}
  currentSignalId=null; activePeerUid=null; isCaller=false;
  remoteDescriptionReady=false; pendingRemoteCandidates=[];
  receivedFileMeta=null; receivedFileChunks=[]; receivedFileBytes=0;
}

function createPeerConnection(){
  peerConnection=new RTCPeerConnection(rtcConfig);
  peerConnection.ondatachannel=(event)=>{dataChannel=event.channel;setupDataChannel();};
  peerConnection.onicecandidate=async(event)=>{
    if(event.candidate){await saveIceCandidate(event.candidate,isCaller?"callerCandidates":"calleeCandidates");}
  };
  peerConnection.onconnectionstatechange=()=>{
    console.log("WebRTC state:",peerConnection?.connectionState);
    if(peerConnection?.connectionState==="failed") chatError.textContent="File connection fail hua. Network/STUN issue ho sakta hai.";
  };
  return peerConnection;
    }
    function setupDataChannel(){
  if(!dataChannel)return;
  dataChannel.binaryType="arraybuffer";
  dataChannel.onopen=()=>{filePreview.textContent="File connection ready. File bhej sakte hain.";};
  dataChannel.onclose=()=>{console.log("File data channel closed");};
  dataChannel.onerror=(e)=>console.error("Data channel error:",e);
  dataChannel.onmessage=(event)=>{
    if(typeof event.data==="string"){
      let packet;try{packet=JSON.parse(event.data);}catch(e){return;}
      if(packet.type==="file-meta"){
        receivedFileMeta=packet;
        receivedFileChunks=[];receivedFileBytes=0;
        filePreview.textContent="File receive ho rahi hai: "+packet.name;
      }else if(packet.type==="file-end"){
        if(!receivedFileMeta)return;
        const blob=new Blob(receivedFileChunks,{type:receivedFileMeta.mime||"application/octet-stream"});
        const url=URL.createObjectURL(blob);
        const link=document.createElement("a");link.href=url;link.download=receivedFileMeta.name||"received-file";link.textContent="Download received file: "+link.download;
        link.style.display="block";link.style.marginTop="8px";
        filePreview.appendChild(link);
        filePreview.insertAdjacentText("beforeend"," ("+Math.round(blob.size/1024)+" KB)");
        receivedFileChunks=[];receivedFileMeta=null;receivedFileBytes=0;
      }
    }else{
      if(receivedFileMeta){receivedFileChunks.push(event.data);receivedFileBytes+=event.data.byteLength;}
    }
  };
}

async function addRemoteCandidate(candidate){
  if(!peerConnection)return;
  if(!remoteDescriptionReady){pendingRemoteCandidates.push(candidate);return;}
  try{await peerConnection.addIceCandidate(candidate);}catch(e){console.warn("Remote ICE candidate:",e);}
}

function listenRemoteCandidates(){
  if(unsubscribeRemoteCandidates)unsubscribeRemoteCandidates();
  const remoteBucket=isCaller?"calleeCandidates":"callerCandidates";
  const q=collection(db,"chats",activeChatId,"signals",currentSignalId,remoteBucket);
  unsubscribeRemoteCandidates=onSnapshot(q,snap=>{
    snap.docChanges().forEach(change=>{
      if(change.type==="added")addRemoteCandidate(new RTCIceCandidate(change.doc.data()));
    });
  },err=>console.error("Remote ICE listener error:",err));
}

async function flushRemoteCandidates(){
  remoteDescriptionReady=true;
  const queued=pendingRemoteCandidates.splice(0);
  for(const candidate of queued){try{await peerConnection.addIceCandidate(candidate);}catch(e){console.warn(e);}}
}

async function startFileTransfer(file){
  if(!file)return;
  if(!activeChatId||!activePeerUid){alert("Pehle chat khol lo.");return;}
  if(file.size>MAX_FILE_SIZE){alert("Abhi file 5 MB se chhoti honi chahiye.");fileInput.value="";return;}
  const peerUid=activePeerUid;
  stopWebRTC();
  activePeerUid=peerUid;
  isCaller=true;
  const signalsRef=collection(db,"chats",activeChatId,"signals");
  const signalDoc=await addDoc(signalsRef,{callerUid:currentUser.uid,calleeUid:activePeerUid,status:"offering",createdAt:serverTimestamp()});
  currentSignalId=signalDoc.id;
  createPeerConnection();
  dataChannel=peerConnection.createDataChannel("file-transfer");setupDataChannel();
  listenRemoteCandidates();
  const offer=await peerConnection.createOffer();await peerConnection.setLocalDescription(offer);
  await updateDoc(signalDoc,{offer:{type:offer.type,sdp:offer.sdp}});
  unsubscribeSignal=onSnapshot(signalDoc,async snap=>{
    const data=snap.data();
    if(data?.answer&&!peerConnection.currentRemoteDescription){
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      await flushRemoteCandidates();
    }
  },err=>console.error("Signal listener:",err));
  filePreview.textContent="File connection ke liye doosre user ka chat open hona zaroori hai...";
  filePreview.dataset.pendingFile="";
  // Once the channel opens, send the selected file.
  dataChannel.onopen=async()=>{
    filePreview.textContent="File bheji ja rahi hai: "+file.name;
    dataChannel.send(JSON.stringify({type:"file-meta",name:file.name,size:file.size,mime:file.type||"application/octet-stream"}));
    const buffer=await file.arrayBuffer();
    for(let offset=0;offset<buffer.byteLength;offset+=FILE_CHUNK_SIZE){
      while(dataChannel.bufferedAmount>1024*1024){await new Promise(resolve=>setTimeout(resolve,40));}
      dataChannel.send(buffer.slice(offset,offset+FILE_CHUNK_SIZE));
    }
    dataChannel.send(JSON.stringify({type:"file-end"}));
    filePreview.textContent="File send ho gayi: "+file.name;
  };
}

function listenForIncomingOffers(peerUid){
  if(unsubscribeIncomingSignals)unsubscribeIncomingSignals();
  const q=query(collection(db,"chats",activeChatId,"signals"),where("calleeUid","==",currentUser.uid),where("callerUid","==",peerUid),where("status","==","offering"));
  unsubscribeIncomingSignals=onSnapshot(q,snapshot=>{
    snapshot.docChanges().forEach(async change=>{
      if(change.type!=="added")return;
      const signalDoc=change.doc;const signal=signalDoc.data();
      if(!signal.offer||peerConnection)return;
      currentSignalId=signalDoc.id;activePeerUid=peerUid;isCaller=false;
      createPeerConnection();listenRemoteCandidates();
      await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.offer));
      await flushRemoteCandidates();
      const answer=await peerConnection.createAnswer();await peerConnection.setLocalDescription(answer);
      await updateDoc(signalDoc.ref,{answer:{type:answer.type,sdp:answer.sdp},status:"answered"});
      filePreview.textContent="Incoming file connection...";
    });
  },error=>console.error("Incoming offer listener:",error));
}

attachBtn.onclick=()=>fileInput.click();
fileInput.onchange=()=>{
  const file=fileInput.files?.[0];if(!file)return;
  filePreview.textContent="Selected: "+file.name+" ("+Math.round(file.size/1024)+" KB)";
  if(file.size>MAX_FILE_SIZE){alert("File 5 MB se chhoti honi chahiye.");fileInput.value="";filePreview.textContent="";return;}
  if(confirm("Is file ko chat partner ko bheje? Dono users ka chat open rehna chahiye.")){
    startFileTransfer(file).catch(error=>{console.error(error);chatError.textContent="File send setup error: "+error.message;});
  }
};

async function openChat(person){
  if(!person.uid)return;
  stopWebRTC();
  activePeerUid=person.uid;
  activeChatId=[currentUser.uid,person.uid].sort().join("_");  
  chatUsername.textContent=person.username||"User";  
  listView.style.display="none";  
  profileView.style.display="none";  
  chatView.style.display="block";  
  messagesDiv.innerHTML='<div class="status">Chat khul rahi hai...</div>';  
  chatError.textContent="";  
  messageInput.focus();  
  
  if(unsubscribeMessages){  
    unsubscribeMessages();  
    unsubscribeMessages=null;  
  }  
  
  try{  
    const chatRef=doc(db,"chats",activeChatId);  
    const chatSnap=await getDoc(chatRef);  
    if(!chatSnap.exists()){  
      await setDoc(chatRef,{  
        members:[currentUser.uid,person.uid],  
        createdAt:serverTimestamp(),  
        lastMessage:"",  
        updatedAt:serverTimestamp()  
      });  
    }  
  
    listenForIncomingOffers(person.uid);
    const messagesQuery=query(
      collection(db,"chats",activeChatId,"messages"),  
      orderBy("createdAt","asc")  
    );  
    unsubscribeMessages=onSnapshot(messagesQuery,snapshot=>{  
      messagesDiv.innerHTML="";  
      if(snapshot.empty){  
        messagesDiv.innerHTML='<div class="status">Pehla message bhejo 👋</div>';  
        return;  
      }  
      snapshot.forEach(messageDoc=>{  
        const msg=messageDoc.data();  
        const bubble=document.createElement("div");  
        bubble.className="msg "+(msg.senderId===currentUser.uid?"mine":"theirs");  
        bubble.textContent=msg.text||"";  
        messagesDiv.appendChild(bubble);  
      });  
      messagesDiv.scrollTop=messagesDiv.scrollHeight;  
    },error=>{  
      console.error(error);  
      chatError.textContent="Messages load error: "+error.message;  
    });  
  }catch(error){  
    console.error(error);  
    chatError.textContent="Chat open nahi hui: "+error.message;  
    messagesDiv.innerHTML='<div class="status">Chat load nahi ho saki.</div>';  
  }  
}  
    backBtn.onclick=()=>{
  stopWebRTC();
  fileInput.value="";filePreview.textContent="";
  chatView.style.display="none";  
  listView.style.display="block";  
  if(unsubscribeMessages){  
    unsubscribeMessages();  
    unsubscribeMessages=null;  
  }  
  activeChatId=null;  
};  
  
sendForm.onsubmit=async event=>{  
  event.preventDefault();  
  const text=messageInput.value.trim();  
  if(!text||!activeChatId)return;  
  sendBtn.disabled=true;  
  chatError.textContent="";  
  try{  
    const chatRef=doc(db,"chats",activeChatId);  
    await addDoc(collection(db,"chats",activeChatId,"messages"),{  
      text,  
      senderId:currentUser.uid,  
      senderUsername:currentProfile.username||"User",  
      createdAt:serverTimestamp()  
    });  
    await updateDoc(chatRef,{  
      lastMessage:text,  
      updatedAt:serverTimestamp()  
    });  
    messageInput.value="";  
    messageInput.focus();  
    await loadRecentChats();  
  }catch(error){  
    console.error(error);  
    chatError.textContent="Message send nahi hua: "+error.message;  
  }finally{  
    sendBtn.disabled=false;  
  }  
};  
  
logoutBtn.onclick=async()=>{
  stopWebRTC();
  logoutBtn.disabled=true;  
  try{  
    await signOut(auth);  
    location.href="login.html";  
  }catch(error){  
    alert("Logout error: "+error.message);  
    logoutBtn.disabled=false;  
  }  
};  
</script>  </body>  
  </html>
